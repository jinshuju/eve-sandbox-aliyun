name: eve drift

# The peer range is `>=0.27.0 <1.0.0`. CI pins both ends it *can* pin: the floor
# and the newest eve this package was verified against. The ceiling is the one
# claim no pinned dependency can cover -- eve releases that do not exist yet --
# so this re-runs the suite against whatever eve@latest is today. A breaking 0.x
# minor then shows up as an issue here instead of a bug report from a deployment.
on:
  schedule:
    # Mondays 03:17 UTC. Off the hour to avoid GitHub's scheduling backlog.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest-eve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the newest eve
        id: eve
        run: echo "version=$(npm view eve version)" >> "$GITHUB_OUTPUT"

      # The lockfile edit is deliberate and deliberately not committed: this job
      # asks "does today's eve still work", it does not change what the package
      # ships.
      - name: Install eve@${{ steps.eve.outputs.version }}
        run: pnpm add -D "eve@${{ steps.eve.outputs.version }}"

      - name: Typecheck against the newest eve
        run: pnpm typecheck

      - name: Test against the newest eve
        run: pnpm test

      - name: Open an issue when the newest eve breaks the contract
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.eve.outputs.version }}";
            const title = `eve ${version} breaks the SandboxBackend contract`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "eve-drift",
            });
            if (existing.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["eve-drift"],
              body: [
                `The scheduled drift check failed against \`eve@${version}\`, which the`,
                "declared peer range `>=0.27.0 <1.0.0` currently accepts.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Either adapt the backend to the new eve, or narrow the peer range's",
                "ceiling and cut a release so consumers stop resolving a version that",
                "does not work.",
              ].join("\n"),
            });
